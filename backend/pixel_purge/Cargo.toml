[package]
name = "pixel-purge"
version = "0.1.0"
edition = "2021"

[dependencies]
# Using rexif instead of exif as it's more maintained
rexif = "0.7"
image = "0.25"
# heif = { version = "0.2.1", features = ["libheif"] }  # Requires libheif library - see SETUP_GUIDE.md
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
