[package]
name = "pixel-purge"
version = "0.1.0"
edition = "2021"

[lib]
name = "pixel_purge"
path = "src/lib.rs"

[dependencies]
image = "0.24.7"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0.86"
log = "0.4.22"
env_logger = "0.11.4"
